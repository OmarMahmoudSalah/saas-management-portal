# ── Nginx Multi-Tenant Reverse Proxy & Custom Domain Config ────────────────────
limit_req_zone $binary_remote_addr zone=saas_limit:10m rate=30r/s;

upstream saas_backend {
    server app:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost *.warehouseapp.com;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        limit_req zone=saas_limit burst=20 nodelay;

        proxy_pass http://saas_backend;
        proxy_http_version 1.1;

        # Multi-Tenant Subdomain Header Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Organization-Subdomain $host;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
