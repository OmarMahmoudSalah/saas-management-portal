version: '3.8'

services:
  # ── Warehouse SaaS Node.js Server ───────────────────────────────────────────
  app:
    build:
      context: ../..
      dockerfile: saas/deployment/Dockerfile.saas
    container_name: warehouse_saas_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_TYPE=postgres
      - DATABASE_URL=postgres://saas_user:saas_secure_pass_2026@db:5432/warehouse_saas
      - JWT_SECRET=wh_saas_jwt_super_secret_2026
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # ── PostgreSQL 17 Primary Multi-Tenant Database ──────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: warehouse_saas_db
    restart: always
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_secure_pass_2026
      POSTGRES_DB: warehouse_saas
    volumes:
      - postgres_saas_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d warehouse_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx Reverse Proxy & Custom Domain Router ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: warehouse_saas_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  postgres_saas_data:
